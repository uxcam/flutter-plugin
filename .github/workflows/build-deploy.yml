name: Publish Flutter Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Check out ${{ github.sha }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Read package version
        id: version
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{ print $2 }')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: v$version"

      - name: Verify package
        run: dart pub publish --dry-run

  publish:
    name: Publish to pub.dev
    needs: validate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pub.dev
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Check out ${{ github.sha }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure pub.dev publishing credentials
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec
        run: |
          expected_tag="v${{ needs.validate.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $expected_tag"
            exit 1
          fi

      - name: Publish to pub.dev
        run: dart pub publish --force

      - name: Generate changelog
        id: changelog
        run: |
          current_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          previous_tag="$(git describe --tags --abbrev=0 "${current_commit}^" 2>/dev/null || true)"
          range="$current_commit"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${current_commit}"
          fi

          logs="$(git log "$range" --no-merges --pretty=format:'%s' -i \
            --grep='^feat.*:' --grep='^fix.*:' \
            | awk -F ':' 'NF > 1 { sub(/^ */, "", $2); print "- " $2 }')"

          {
            echo "logs<<CHANGELOG_EOF"
            echo "$logs"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$logs"

      - name: Create GitHub Release
        id: release
        env:
          BODY: ${{ steps.changelog.outputs.logs }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            url="$(gh release view "$GITHUB_REF_NAME" --json url -q .url)"
          else
            url="$(gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "$BODY" \
              --latest)"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        continue-on-error: true
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        env:
          PKG_VERSION: ${{ github.ref_name }}
          CHANGELOG: ${{ steps.changelog.outputs.logs }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-templated: true
          payload: |
            text: ":rocket: UXCam Flutter Plugin {{ env.PKG_VERSION }} released :rocket:"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "<!here> UXCam Flutter Plugin *{{ env.PKG_VERSION }}* has been released."
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*SDK*\nFlutter Plugin"
                  - type: mrkdwn
                    text: "*Version*\n{{ env.PKG_VERSION }}"
              - type: section
                text:
                  type: mrkdwn
                  text: "*CHANGELOG (Internal):*\n{{ env.CHANGELOG }}"
              - type: section
                text:
                  type: mrkdwn
                  text: "<{{ env.RELEASE_URL }}|View release notes>"
