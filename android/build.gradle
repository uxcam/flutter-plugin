group 'com.uxcam.flutteruxcam'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.2.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://sdk.uxcam.com/android/'
        }
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 34

    if (project.android.hasProperty("namespace")) {
        namespace("com.uxcam.flutteruxcam")
    }

    defaultConfig {
        minSdkVersion 21
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    //To use the alpha version please use the following dependency pattern: implementation 'com.uxcam:uxcam-debug:<sdk-version>-alpha.1+<branch-commit-hash>'
    implementation 'com.uxcam:uxcam:3.10.10'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}